<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page grid</title>
<style>
/* tokens */
/* layout */
body{margin:0}
h1{font-size:var(--pa-fs-h1);line-height:var(--pa-lh-h1)}
figcaption{font-size:var(--pa-fs-caption);color:var(--pa-text-2)}
.bar{height:24px;background:var(--pa-cat-1)}
.fig-num{font-size:34px;line-height:41px;font-variant-numeric:tabular-nums}
.fig-label{font-size:13px;color:var(--pa-text-2)}
</style></head><body><div class="pa-page">
<h1>Chinese firms shipped four in five humanoid robots in 2025</h1>
<p>About 13,000 humanoid robots shipped in 2025, and Chinese makers built about 10,400 of them.</p>
<aside class="pa-aside"><div class="fig-num">80%</div><div class="fig-label">share shipped by Chinese firms</div></aside>
<figure>
  <div role="img" aria-label="China 80 percent, rest of world 20 percent" style="padding-block:8px">
    <div class="bar" data-encodes="share-china" style="width:80%"></div>
  </div>
  <figcaption>China 80%, rest of world 20%, of about 13,000 units.</figcaption>
</figure>
<p>The page grid widens the column with the screen and moves asides into a rail from 1440px.</p>
</div></body></html>
