<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narrow column</title>
<style>
:root{--pa-bg:#ffffff;--pa-text:#161616;--pa-text-2:#525252;--pa-cat-1:#6929c4}
body{margin:0;background:var(--pa-bg);color:var(--pa-text);font:16px/24px system-ui,sans-serif;padding-inline:16px;padding-block:16px}
main{max-width:680px;margin:0 auto}
h1{font-size:32px;line-height:40px;font-weight:400}
figcaption{font-size:14px;color:var(--pa-text-2)}
.bar{height:24px;background:var(--pa-cat-1)}
</style></head><body><main>
<h1>Chinese firms shipped four in five humanoid robots in 2025</h1>
<figure>
  <div role="img" aria-label="China 80 percent, rest of world 20 percent" style="padding-block:8px">
    <div class="bar" data-encodes="share-china" style="width:80%"></div>
  </div>
  <figcaption>China 80%, rest of world 20%, of about 13,000 units.</figcaption>
</figure>
<p>The column stops at 680px however wide the screen is, so at 1280px nearly half the width is margin.</p>
</main></body></html>
