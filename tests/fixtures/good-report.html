<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good report</title>
<style>
:root{--pa-bg:#ffffff;--pa-surface:#f4f4f4;--pa-text:#161616;--pa-text-2:#525252;--pa-interactive:#0f62fe;--pa-cat-1:#6929c4}
:root[data-theme="dark"]{--pa-bg:#161616;--pa-surface:#262626;--pa-text:#f4f4f4;--pa-text-2:#c6c6c6;--pa-interactive:#4589ff;--pa-cat-1:#8a3ffc}
body{margin:0;background:var(--pa-bg);color:var(--pa-text);font:16px/24px system-ui,sans-serif;padding-inline:16px;padding-block:16px}
main{max-width:680px;margin:0 auto}
h1{font-size:32px;line-height:40px;font-weight:400;margin:0 0 16px}
h2{font-size:20px;line-height:28px;margin:32px 0 8px}
figure{margin:0}
figcaption{font-size:14px;color:var(--pa-text-2)}
.bar{height:24px;background:var(--pa-cat-1)}
summary{color:var(--pa-interactive);cursor:pointer}
</style></head><body><main>
<h1>Chinese firms shipped four in five humanoid robots in 2025</h1>
<figure>
  <div role="img" aria-label="Share of 2025 humanoid shipments: China 80 percent, rest of world 20 percent" style="padding-block:8px">
    <div class="bar" data-encodes="share-china" style="width:80%"></div>
    <div class="bar" data-encodes="share-rest" style="width:20%;opacity:.5;margin-top:4px"></div>
  </div>
  <figcaption>China 80%, rest of world 20%, of about 13,000 units.</figcaption>
</figure>
<h2>Five makers lead</h2>
<ul><li>AgiBot</li><li>Unitree</li><li>UBTech</li><li>Figure</li><li>Tesla</li></ul>
<details><summary>Show all 14 makers</summary>
<ul><li>Galbot</li><li>LimX</li><li>Booster</li><li>Fourier</li><li>EngineAI</li><li>Robot Era</li><li>MagicLab</li><li>Apptronik</li><li>Agility</li></ul>
</details>
</main></body></html>
