<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carbon legend</title>
<style>
body{margin:0;background:#fff;color:#161616;font:16px/24px system-ui,sans-serif;padding:16px}
.cds--cc--legend .legend-item{display:flex;gap:8px;align-items:center;font-size:12px}
.cds--cc--legend .checkbox{width:12px;height:12px;border:1px solid #6929c4}
</style></head><body>
<h1>Carbon chart legend markup stays exempt</h1>
<figure role="img" aria-label="chart" style="height:200px;width:400px">
<div class="cds--cc--chart-wrapper"><div class="cds--cc--legend">
  <div class="legend-item"><div class="checkbox" style="background:rgb(105,41,196)"></div><p>Series A</p></div>
  <div class="legend-item"><div class="checkbox" style="background:rgb(0,157,154)"></div><p>Series B</p></div>
</div></div>
</figure>
</body></html>
